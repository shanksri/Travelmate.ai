<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>travelmate.ai</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main>
    <section class="card prompt-card">
      <div class="card-header">
        <h1>Where do you want to go?</h1>
        <span class="badge" id="status-badge">
          <span class="dot" id="status-dot"></span>
          <span id="status-text">Checking…</span>
        </span>
      </div>
      <p class="hint">Example: Plan a complete 7 day Japan trip from Delhi under 3 lakhs.</p>

      <form id="prompt-form">
        <textarea
          id="prompt-input"
          name="prompt"
          rows="3"
          maxlength="2000"
          placeholder="Plan a 5 day Dubai trip from Mumbai with flights, hotels and sightseeing."
          required
        ></textarea>
        <div class="form-footer">
          <button type="submit" id="submit-button">Generate Plan</button>
        </div>
      </form>

      <div class="chips" id="chips">
        <button type="button" class="chip" data-prompt="Plan a complete 7 day Japan trip from Delhi with flights, hotels and sightseeing, balanced pace, interested in food and history.">Japan Trip</button>
        <button type="button" class="chip" data-prompt="Plan a 5 day Dubai trip from Mumbai with flights, hotels and sightseeing.">Dubai Trip</button>
        <button type="button" class="chip" data-prompt="Plan a 6 day Thailand trip from Bengaluru under 2 lakhs, relaxed pace, interested in beaches and food.">Thailand Trip</button>
        <button type="button" class="chip" data-prompt="Plan a 4 day trip to Jaipur from Delhi, interested in food and history.">Jaipur Trip</button>
      </div>
    </section>

    <div id="status" class="status" hidden></div>

    <section id="result" class="result" hidden></section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
