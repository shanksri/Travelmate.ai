[project]
name = "travelmate-ai"
version = "0.1.0"
description = "An agentic trip planner: Claude plans multi-day itineraries by calling travel tools."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.69.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.4.0",
    "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2,<9",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
