services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY in your shell or .env}
      TRAVELMATE_MODEL: ${TRAVELMATE_MODEL:-llama-3.3-70b-versatile}
      TRAVELMATE_TEMPERATURE: ${TRAVELMATE_TEMPERATURE:-0.3}
      TRAVELMATE_PROVIDER: ${TRAVELMATE_PROVIDER:-mock}
      TRAVELMATE_LOG_LEVEL: ${TRAVELMATE_LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
